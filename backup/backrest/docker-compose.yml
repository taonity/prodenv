services:
  backrest:
    image: ghcr.io/garethgeorge/backrest:v1.14.1
    restart: unless-stopped
    hostname: backrest
    env_file:
      - .env
    environment:
      BACKREST_DATA: /data
      BACKREST_CONFIG: /config/config.json
      XDG_CACHE_HOME: /cache
      TMPDIR: /tmp
    volumes:
      - backrest-data:/data
      - backrest-config:/config
      - backrest-cache:/cache
      - backrest-tmp:/tmp
      - backup-staging:/userdata:ro
      - backup-restore:/restore
      - monitoring-textfile:/metrics
      - ../scripts:/hooks:ro
    secrets:
      - source: backrest-repository-password
        target: backrest_repository_password
      - source: backrest-aws-credentials
        target: backrest_aws_credentials
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9898/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  backrest-bootstrap:
    image: python:3.13.7-alpine3.22
    restart: "no"
    command: ["python", "/bootstrap/bootstrap.py"]
    env_file:
      - .env
    environment:
      BACKREST_URL: http://backrest:9898
      BACKREST_DESIRED_CONFIG: /bootstrap/desired.json
      BACKREST_ADMIN_PASSWORD_FILE: /run/secrets/backrest_admin_password
    volumes:
      - ./bootstrap.py:/bootstrap/bootstrap.py:ro
      - ./desired.json:/bootstrap/desired.json:ro
    secrets:
      - source: backrest-admin-password
        target: backrest_admin_password
    security_opt:
      - no-new-privileges:true
    depends_on:
      backrest:
        condition: service_healthy

  backrest-restore-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: restore-validation-only
    volumes:
      - backup-validation-db:/var/lib/postgresql/data
    networks:
      - backup-validation
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12

  backrest-restore-validator:
    build:
      context: .
      dockerfile: Dockerfile.restore-validator
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKREST_URL: http://backrest:9898
      BACKREST_ADMIN_PASSWORD_FILE: /run/secrets/backrest_admin_password
      RESTORE_VALIDATOR_CONFIG: /validator/config.json
      RESTORE_ROOT: /restore/automated
      METRICS_DIRECTORY: /metrics
      PGHOST: backrest-restore-db
      PGPASSWORD: restore-validation-only
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - backup-restore:/restore
      - monitoring-textfile:/metrics
      - ./restore_validator.py:/validator/restore_validator.py:ro
      - ./restore-validation.json:/validator/config.json:ro
    secrets:
      - source: backrest-admin-password
        target: backrest_admin_password
    networks:
      - backup-validation
    security_opt:
      - no-new-privileges:true
    depends_on:
      backrest:
        condition: service_healthy
      backrest-restore-db:
        condition: service_healthy