services:
  backrest:
    image: ghcr.io/garethgeorge/backrest:v1.14.1
    restart: unless-stopped
    hostname: backrest
    environment:
      BACKREST_DATA: /data
      BACKREST_CONFIG: /config/config.json
      XDG_CACHE_HOME: /cache
      TMPDIR: /tmp
      TZ: ${TZ:-UTC}
      NTFY_URL: ${BACKUP_NTFY_URL:-}
      NTFY_TOKEN: ${BACKUP_NTFY_TOKEN:-}
    volumes:
      - backrest-data:/data
      - backrest-config:/config
      - backrest-cache:/cache
      - backrest-tmp:/tmp
      - backup-staging:/userdata:ro
      - backup-restore:/restore
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9898/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s