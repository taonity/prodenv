services:
  backrest:
    image: ghcr.io/garethgeorge/backrest:v1.14.1
    restart: unless-stopped
    hostname: backrest
    env_file:
      - .env
    environment:
      BACKREST_DATA: /data
      BACKREST_CONFIG: /config/config.json
      XDG_CACHE_HOME: /cache
      TMPDIR: /tmp
    volumes:
      - backrest-data:/data
      - backrest-config:/config
      - backrest-cache:/cache
      - backrest-tmp:/tmp
      - backup-staging:/userdata:ro
      - backup-restore:/restore
      - ../scripts:/hooks:ro
    secrets:
      - source: backrest-repository-password
        target: backrest_repository_password
      - source: backrest-aws-credentials
        target: backrest_aws_credentials
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9898/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  backrest-bootstrap:
    image: python:3.13.7-alpine3.22
    restart: "no"
    command: ["python", "/bootstrap/bootstrap.py"]
    env_file:
      - .env
    environment:
      BACKREST_URL: http://backrest:9898
      BACKREST_DESIRED_CONFIG: /bootstrap/desired.json
      BACKREST_ADMIN_PASSWORD_FILE: /run/secrets/backrest_admin_password
    volumes:
      - ./bootstrap.py:/bootstrap/bootstrap.py:ro
      - ./desired.json:/bootstrap/desired.json:ro
    secrets:
      - source: backrest-admin-password
        target: backrest_admin_password
    security_opt:
      - no-new-privileges:true
    depends_on:
      backrest:
        condition: service_healthy