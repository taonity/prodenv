services:
  docker-webhook:
    image: generaltao725/docker-webhook:0.10.0
    environment:
      DOCKER_WEBHOOK_DOPPLER_MANAGED_DEPLOYMENTS: ${DOCKER_WEBHOOK_DOPPLER_MANAGED_DEPLOYMENTS:-fullstack-starter-stage}
    volumes:
      - type: bind
        source: /run/prodenv-doppler
        target: /run/prodenv-doppler
        read_only: true
        bind:
          create_host_path: false

  backrest:
    volumes:
      - type: bind
        source: /var/lib/prodenv-secret-recovery
        target: /secret-recovery
        read_only: true
        bind:
          create_host_path: false

  backrest-bootstrap:
    volumes:
      - type: bind
        source: /etc/prodenv-doppler/backrest-desired.json
        target: /bootstrap/desired.json
        read_only: true
        bind:
          create_host_path: false