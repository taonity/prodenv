services:
  ntfy:
    image: binwiederhier/ntfy:v2.26
    command:
      - serve
    environment:
      - TZ=UTC    # optional: set desired timezone
    # user: UID:GID # optional: replace with your own user/group or uid/gid
      # Set your public domain or local reverse proxy address
      - NTFY_BASE_URL=https://ntfy.taonity.org
      
      # Informs ntfy to trust X-Forwarded-For headers from Nginx for rate-limiting
      - NTFY_BEHIND_PROXY=true
      
      # Persistent SQLite cache so missed notifications stay available after restart
      - NTFY_CACHE_FILE=/var/lib/ntfy/cache.db
      - NTFY_ATTACHMENT_CACHE_DIR=/var/lib/ntfy/attachments
      
      # Optional: Enable authentication if you want to protect your server/topics
      - NTFY_ENABLE_LOGIN=true
      - NTFY_AUTH_FILE=/var/lib/ntfy/auth.db
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
    env_file:
     - .env
    volumes:
      - ./ntfy-data:/var/lib/ntfy
      - ./ntfy-config:/etc/ntfy
    healthcheck: # optional: remember to adapt the host:port to your environment
        test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
        interval: 60s
        timeout: 10s
        retries: 3
        start_period: 40s
    restart: unless-stopped
    init: true # needed, if healthcheck is used. Prevents zombie processes