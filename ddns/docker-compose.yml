services:
  ddns:
    image: favonia/cloudflare-ddns:1.18.0
    network_mode: host
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    env_file:
     - .env
    environment:
      - DOMAINS=taonity.org,*.taonity.org,webhook.taonity.org
      - PROXIED=!is(webhook.taonity.org)
