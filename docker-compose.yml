services:

  docker-webhook:
    extends:
      file: cicd/docker-webhook/docker-compose.yml
      service: docker-webhook
    networks:
     - nginx

  loki:
    extends:
      file: logging/loki/docker-compose.yml
      service: loki
    networks:
     - logging
    depends_on:
      minio:
        condition: service_healthy

  promtail:
    extends:
      file: logging/promtail/docker-compose.yml
      service: promtail
    networks:
     - logging
    depends_on:
      loki:
        condition: service_healthy

  minio:
    extends:
      file: logging/minio/docker-compose.yml
      service: minio
    networks:
     - logging

  node-exporter:
    extends:
      file: logging/node-exporter/docker-compose.yml
      service: node-exporter
    networks:
     - logging
  
  prometheus:
    extends:
      file: logging/prometheus/docker-compose.yml
      service: prometheus
    networks:
     - logging
     - artist-insight-shared
    depends_on:
      node-exporter:
        condition: service_started

  grafana-curl:
    extends:
      file: logging/grafana/curl/docker-compose.yml
      service: grafana-curl

  grafana:
    extends:
      file: logging/grafana/docker-compose.yml
      service: grafana
    networks:
     - logging
     - nginx
    depends_on:
      loki:
        condition: service_healthy
      promtail:
        condition: service_started
      prometheus:
        condition: service_started
      grafana-curl:
        condition: service_completed_successfully
  
  # grafana-curl:
  #   extends:
  #     file: logging/grafana/curl/docker-compose.yml
  #     service: grafana-curl
  #   depends_on:
  #     grafana:
  #       condition: service_started

  grafana-mcp-bootstrap:
    extends:
      file: logging/grafana-mcp/docker-compose.yml
      service: grafana-mcp-bootstrap
    networks:
      - logging
    depends_on:
      grafana:
        condition: service_started

  grafana-mcp:
    extends:
      file: logging/grafana-mcp/docker-compose.yml
      service: grafana-mcp
    networks:
      - logging
      - artist-insight-shared
    depends_on:
      grafana-mcp-bootstrap:
        condition: service_completed_successfully

  logcli:
    extends:
      file: logging/logcli/docker-compose.yml
      service: logcli
    networks:
     - logging
    depends_on:
      loki:
        condition: service_healthy

  backrest:
    extends:
      file: backup/backrest/docker-compose.yml
      service: backrest
    networks:
      - nginx

  backrest-bootstrap:
    extends:
      file: backup/backrest/docker-compose.yml
      service: backrest-bootstrap
    networks:
      - nginx

  portainer:
    extends:
      file: portainer/docker-compose.yml
      service: portainer
    networks:
     - nginx
     
  nginx:
    extends:
      file: nginx/nginx/docker-compose.yml
      service: nginx
    networks:
     - nginx
     - prodenv-shared-internal
  certbot:
    extends:
      file: nginx/certbot/docker-compose.yml
      service: certbot

  ddns:
    extends:
      file: ddns/docker-compose.yml
      service: ddns
  
  ntfy:
    extends:
      file: ntfy/docker-compose.yml
      service: ntfy
    networks:
     - nginx
 
volumes:
  backrest-data:
  backrest-config:
  backrest-cache:
  backrest-tmp:
  backup-staging:
    name: prodenv-backup-staging
  backup-restore:
    name: prodenv-backup-restore
  minio-data:
  portainer-data:
  nginx-proxy-manager-data:
  prometheus_data:

networks:
  nginx:
  logging:
  prodenv-shared-internal:
    external: true
  artist-insight-shared:
    external: true

secrets:
  backrest-admin-password:
    file: ./backup/backrest/secrets/admin_password
  backrest-repository-password:
    file: ./backup/backrest/secrets/repository_password
  backrest-aws-credentials:
    file: ./backup/backrest/secrets/aws_credentials