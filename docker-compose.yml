services:

  docker-webhook:
    extends:
      file: cicd/docker-webhook/docker-compose.yml
      service: docker-webhook
    cpus: 0.50
    mem_limit: 128m
    memswap_limit: 192m
    pids_limit: 256
    networks:
     - nginx

  loki:
    extends:
      file: logging/loki/docker-compose.yml
      service: loki
    cpus: 1.00
    mem_limit: 512m
    memswap_limit: 768m
    pids_limit: 256
    networks:
     - logging
    depends_on:
      minio:
        condition: service_healthy

  promtail:
    extends:
      file: logging/promtail/docker-compose.yml
      service: promtail
    cpus: 0.50
    mem_limit: 128m
    memswap_limit: 192m
    pids_limit: 256
    networks:
     - logging
    depends_on:
      loki:
        condition: service_healthy

  minio:
    extends:
      file: logging/minio/docker-compose.yml
      service: minio
    cpus: 1.00
    mem_limit: 512m
    memswap_limit: 768m
    pids_limit: 256
    networks:
     - logging

  node-exporter:
    extends:
      file: logging/node-exporter/docker-compose.yml
      service: node-exporter
    cpus: 0.50
    mem_limit: 64m
    memswap_limit: 96m
    pids_limit: 256
    networks:
     - logging

  cadvisor:
    extends:
      file: logging/cadvisor/docker-compose.yml
      service: cadvisor
    cpus: 0.50
    mem_limit: 192m
    memswap_limit: 256m
    pids_limit: 256
    networks:
     - logging
  
  prometheus:
    extends:
      file: logging/prometheus/docker-compose.yml
      service: prometheus
    cpus: 1.00
    mem_limit: 384m
    memswap_limit: 576m
    pids_limit: 256
    networks:
     - logging
     - artist-insight-shared
    depends_on:
      node-exporter:
        condition: service_started

  grafana:
    extends:
      file: logging/grafana/docker-compose.yml
      service: grafana
    cpus: 0.50
    mem_limit: 256m
    memswap_limit: 384m
    pids_limit: 256
    networks:
     - logging
     - nginx
    depends_on:
      loki:
        condition: service_healthy
      promtail:
        condition: service_started
      prometheus:
        condition: service_started

  grafana-mcp-bootstrap:
    extends:
      file: logging/grafana-mcp/docker-compose.yml
      service: grafana-mcp-bootstrap
    cpus: 0.50
    mem_limit: 64m
    memswap_limit: 96m
    pids_limit: 256
    networks:
      - logging
    depends_on:
      grafana:
        condition: service_started

  grafana-mcp:
    extends:
      file: logging/grafana-mcp/docker-compose.yml
      service: grafana-mcp
    cpus: 0.50
    mem_limit: 128m
    memswap_limit: 192m
    pids_limit: 256
    networks:
      - logging
      - artist-insight-shared
    depends_on:
      grafana-mcp-bootstrap:
        condition: service_completed_successfully

  logcli:
    extends:
      file: logging/logcli/docker-compose.yml
      service: logcli
    cpus: 0.50
    mem_limit: 128m
    memswap_limit: 192m
    pids_limit: 256
    networks:
     - logging
    depends_on:
      loki:
        condition: service_healthy

  backrest:
    extends:
      file: backup/backrest/docker-compose.yml
      service: backrest
    cpus: 1.00
    mem_limit: 768m
    memswap_limit: 1152m
    pids_limit: 256
    networks:
      - nginx

  backrest-bootstrap:
    extends:
      file: backup/backrest/docker-compose.yml
      service: backrest-bootstrap
    cpus: 0.50
    mem_limit: 128m
    memswap_limit: 192m
    pids_limit: 256
    networks:
      - nginx

  portainer:
    extends:
      file: portainer/docker-compose.yml
      service: portainer
    cpus: 0.50
    mem_limit: 128m
    memswap_limit: 192m
    pids_limit: 256
    networks:
     - nginx
     
  nginx:
    extends:
      file: nginx/nginx/docker-compose.yml
      service: nginx
    cpus: 0.50
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 256
    networks:
     - nginx
     - prodenv-shared-internal
  certbot:
    extends:
      file: nginx/certbot/docker-compose.yml
      service: certbot
    cpus: 0.50
    mem_limit: 128m
    memswap_limit: 192m
    pids_limit: 256

  ddns:
    extends:
      file: ddns/docker-compose.yml
      service: ddns
    cpus: 0.50
    mem_limit: 32m
    memswap_limit: 48m
    pids_limit: 256
  
  ntfy:
    extends:
      file: ntfy/docker-compose.yml
      service: ntfy
    cpus: 0.50
    mem_limit: 128m
    memswap_limit: 192m
    pids_limit: 256
    networks:
     - nginx
 
volumes:
  backrest-data:
  backrest-config:
  backrest-cache:
  backrest-tmp:
  backup-staging:
    name: prodenv-backup-staging
  backup-restore:
    name: prodenv-backup-restore
  minio-data:
  portainer-data:
  nginx-proxy-manager-data:
  prometheus_data:

networks:
  nginx:
  logging:
  prodenv-shared-internal:
    external: true
  artist-insight-shared:
    external: true

secrets:
  backrest-admin-password:
    file: ./backup/backrest/secrets/admin_password
  backrest-repository-password:
    file: ./backup/backrest/secrets/repository_password
  backrest-aws-credentials:
    file: ./backup/backrest/secrets/aws_credentials