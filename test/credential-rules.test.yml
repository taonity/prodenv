rule_files:
  - ../logging/prometheus/credential-alerts.yml
evaluation_interval: 1m
tests:
  - name: inactive pilot does not alert
    interval: 1m
    promql_expr_test:
      - expr: ALERTS{security="credentials",alertstate="firing"}
        eval_time: 1h
        exp_samples: []
  - name: expiry windows are exclusive and never is not expired
    interval: 1m
    input_series:
      - series: prodenv_credential_expiry_timestamp_seconds{project="fixture",credential="month"}
        values: '1728000+0x30'
      - series: prodenv_credential_expiry_timestamp_seconds{project="fixture",credential="week"}
        values: '259200+0x30'
      - series: prodenv_credential_expiry_timestamp_seconds{project="fixture",credential="day"}
        values: '43200+0x30'
      - series: prodenv_credential_expiry_timestamp_seconds{project="fixture",credential="expired"}
        values: '0+0x30'
      - series: prodenv_credential_expiry_known{project="fixture",credential="never"}
        values: '1+0x30'
    promql_expr_test:
      - expr: count by (alertname) (ALERTS{security="credentials",alertstate="firing"})
        eval_time: 20m
        exp_samples:
          - labels: '{alertname="CredentialExpiresWithin30Days"}'
            value: 1
          - labels: '{alertname="CredentialExpiresWithin7Days"}'
            value: 1
          - labels: '{alertname="CredentialExpiresWithin1Day"}'
            value: 1
          - labels: '{alertname="CredentialExpired"}'
            value: 1
  - name: missing policy overdue review and failed deployment alert
    interval: 1m
    input_series:
      - series: prodenv_credential_expiry_known{project="fixture",credential="unknown"}
        values: '0+0x30'
      - series: prodenv_credential_review_timestamp_seconds{project="fixture",credential="review"}
        values: '0+0x30'
      - series: prodenv_secret_delivery_success{project="fixture"}
        values: '0+0x30'
    promql_expr_test:
      - expr: count by (alertname) (ALERTS{security="credentials",alertstate="firing"})
        eval_time: 20m
        exp_samples:
          - labels: '{alertname="CredentialExpiryUnknown"}'
            value: 1
          - labels: '{alertname="CredentialReviewOverdue"}'
            value: 1
          - labels: '{alertname="CredentialDeliveryFailed"}'
            value: 1
  - name: stale and disappeared inventory are visible
    interval: 1m
    input_series:
      - series: prodenv_secret_inventory_timestamp_seconds{project="stale"}
        values: '0+0x180'
      - series: prodenv_secret_delivery_expected{project="missing"}
        values: '1+0x180'
    promql_expr_test:
      - expr: count(ALERTS{alertname="CredentialInventoryStale",alertstate="firing"})
        eval_time: 3h
        exp_samples:
          - labels: '{}'
            value: 2
  - name: recovery export failure and missing offsite evidence alert separately
    interval: 1m
    input_series:
      - series: prodenv_secret_export_success{project="fixture"}
        values: '0+0x30'
      - series: prodenv_secret_export_timestamp_seconds{project="fixture"}
        values: '1+0x30'
    promql_expr_test:
      - expr: count by (alertname) (ALERTS{security="credentials",alertstate="firing"})
        eval_time: 20m
        exp_samples:
          - labels: '{alertname="CredentialRecoveryExportFailed"}'
            value: 1
          - labels: '{alertname="CredentialRecoveryOffsiteStale"}'
            value: 1
  - name: fresh encrypted export and offsite snapshot are healthy
    interval: 1m
    input_series:
      - series: prodenv_secret_export_success{project="fixture"}
        values: '1+0x30'
      - series: prodenv_secret_export_timestamp_seconds{project="fixture"}
        values: '1+60x30'
      - series: prodenv_backup_last_success_timestamp_seconds{operation="secret-recovery"}
        values: '1+60x30'
    promql_expr_test:
      - expr: ALERTS{security="credentials",alertstate="firing"}
        eval_time: 20m
        exp_samples: []