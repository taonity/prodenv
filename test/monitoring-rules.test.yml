rule_files:
  - ../logging/prometheus/bot-alerts.yml
  - ../logging/prometheus/host-health-alerts.yml
evaluation_interval: 1m
tests:
  - name: bot participation requires four bot messages and a full fresh room window
    interval: 1m
    input_series:
      - series: up{job="sinair-llm-bot-prod",instance="backend"}
        values: '1 1 1 1 1 1 0 1'
      - series: bot_metrics_snapshot_timestamp_seconds{job="sinair-llm-bot-prod",instance="backend",platform="sinair"}
        values: '0 60 120 180 180 180 360 420'
      - series: bot_chat_window_messages{job="sinair-llm-bot-prod",instance="backend",platform="sinair",room="#chat",window="100"}
        values: '100 100 99 100 100 100 100 100'
      - series: bot_chat_window_bot_messages{job="sinair-llm-bot-prod",instance="backend",platform="sinair",room="#chat",window="100"}
        values: '3 4 4 5 5 5 5 3'
      - series: bot_chat_window_messages{job="sinair-llm-bot-prod",instance="backend",platform="sinair",room="#quiet",window="100"}
        values: '100+0x7'
      - series: bot_chat_window_bot_messages{job="sinair-llm-bot-prod",instance="backend",platform="sinair",room="#quiet",window="100"}
        values: '3+0x7'
      - series: bot_chat_window_messages{job="sinair-llm-bot-stage",instance="stage",platform="sinair",room="#chat",window="100"}
        values: '100+0x7'
      - series: bot_chat_window_bot_messages{job="sinair-llm-bot-stage",instance="stage",platform="sinair",room="#chat",window="100"}
        values: '10+0x7'
    alert_rule_test:
      - eval_time: 0m
        alertname: BotChatParticipationHigh
        exp_alerts: []
      - eval_time: 1m
        alertname: BotChatParticipationHigh
        exp_alerts:
          - exp_labels:
              job: sinair-llm-bot-prod
              instance: backend
              platform: sinair
              room: '#chat'
              window: '100'
              severity: warning
              project: sinair-llm-bot-prod
            exp_annotations:
              summary: 'sinair-llm-bot-prod sent 4 of the last 100 messages in #chat'
              description: '4 or more bot messages in the latest 100 total chat messages. Check recent replies in the bot console.'
      - eval_time: 2m
        alertname: BotChatParticipationHigh
        exp_alerts: []
      - eval_time: 5m
        alertname: BotChatParticipationHigh
        exp_alerts: []
      - eval_time: 6m
        alertname: BotChatParticipationHigh
        exp_alerts: []
      - eval_time: 7m
        alertname: BotChatParticipationHigh
        exp_alerts: []
    promql_expr_test:
      - expr: max by (room) (ALERTS{alertname="BotChatParticipationHigh",alertstate="firing",job="sinair-llm-bot-prod"} * on(job, instance, platform, room, window) bot_chat_window_bot_messages{job="sinair-llm-bot-prod",window="100"}) or vector(0)
        eval_time: 1m
        exp_samples:
          - labels: '{room="#chat"}'
            value: 4
          - labels: '{}'
            value: 0
      - expr: max by (room) (ALERTS{alertname="BotChatParticipationHigh",alertstate="firing",job="sinair-llm-bot-prod"} * on(job, instance, platform, room, window) bot_chat_window_bot_messages{job="sinair-llm-bot-prod",window="100"}) or vector(0)
        eval_time: 7m
        exp_samples:
          - labels: '{}'
            value: 0
  - name: old textfile health must not be treated as live
    interval: 1m
    input_series:
      - series: up{job="node",instance="host"}
        values: '1+0x30'
      - series: prodenv_health_last_run_timestamp_seconds{job="node",instance="host"}
        values: '1+0x30'
      - series: prodenv_health_probe_last_success_timestamp_seconds{job="node",instance="host",probe="cpu",profile="test"}
        values: '1+0x30'
      - series: prodenv_health_probe_period_seconds{job="node",instance="host",probe="cpu",profile="test"}
        values: '3600+0x30'
    promql_expr_test:
      - expr: prodenv:health_fresh
        eval_time: 25m
        exp_samples: []
      - expr: prodenv:probe_fresh
        eval_time: 25m
        exp_samples: []
      - expr: count(ALERTS{alertname="HostHealthCollectorStale",alertstate="firing"})
        eval_time: 25m
        exp_samples:
          - labels: '{}'
            value: 1
  - name: degraded alert requires repeated fresh successful probes
    interval: 1m
    input_series:
      - series: up{job="node",instance="host"}
        values: '1+0x30'
      - series: prodenv_health_last_run_timestamp_seconds{job="node",instance="host"}
        values: '0+60x30'
      - series: prodenv_health_probe_last_success_timestamp_seconds{job="node",instance="host",probe="cpu",profile="test"}
        values: '1+0x30'
      - series: prodenv_health_probe_period_seconds{job="node",instance="host",probe="cpu",profile="test"}
        values: '3600+0x30'
      - series: prodenv_health_probe_status{job="node",instance="host",probe="cpu",profile="test"}
        values: '1+0x15 2+0x15'
      - series: prodenv_health_probe_degraded_runs{job="node",instance="host",probe="cpu",profile="test"}
        values: '3+0x30'
    promql_expr_test:
      - expr: count(ALERTS{alertname="HostBenchmarkDegraded",alertstate="firing"})
        eval_time: 10m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: ALERTS{alertname="HostBenchmarkDegraded",alertstate="firing"}
        eval_time: 25m
        exp_samples: []
  - name: quiet healthy bot does not alert
    interval: 1m
    input_series:
      - series: up{job="sinair-llm-bot-prod"}
        values: '1+0x30'
      - series: bot_metrics_snapshot_timestamp_seconds{job="sinair-llm-bot-prod"}
        values: '0+60x30'
      - series: bot_collector_heartbeat_timestamp_seconds{job="sinair-llm-bot-prod"}
        values: '0+60x30'
      - series: bot_llm_usage_timestamp_seconds{job="sinair-llm-bot-prod"}
        values: '0+60x30'
      - series: bot_state_enabled{job="sinair-llm-bot-prod"}
        values: '1+0x30'
      - series: bot_state_configured_rooms{job="sinair-llm-bot-prod"}
        values: '1+0x30'
      - series: bot_state_active_rooms{job="sinair-llm-bot-prod"}
        values: '1+0x30'
      - series: bot_collector_joined_rooms{job="sinair-llm-bot-prod"}
        values: '1+0x30'
      - series: bot_collector_sending_enabled{job="sinair-llm-bot-prod"}
        values: '1+0x30'
      - series: bot_queue_oldest_timestamp_seconds{job="sinair-llm-bot-prod",queue="inbox"}
        values: '0+0x30'
    promql_expr_test:
      - expr: ALERTS{alertstate="firing"}
        eval_time: 20m
        exp_samples: []
  - name: stale data and stuck work are actionable
    interval: 1m
    input_series:
      - series: up{job="sinair-llm-bot-prod"}
        values: '1+0x30'
      - series: bot_metrics_snapshot_timestamp_seconds{job="sinair-llm-bot-prod"}
        values: '0+60x30'
      - series: bot_state_enabled{job="sinair-llm-bot-prod"}
        values: '1+0x30'
      - series: bot_collector_heartbeat_timestamp_seconds{job="sinair-llm-bot-prod"}
        values: '1+0x30'
      - series: bot_llm_usage_timestamp_seconds{job="sinair-llm-bot-prod"}
        values: '1+0x30'
      - series: bot_queue_oldest_timestamp_seconds{job="sinair-llm-bot-prod",queue="outbound"}
        values: '1+0x30'
    promql_expr_test:
      - expr: count by (alertname) (ALERTS{alertstate="firing"})
        eval_time: 25m
        exp_samples:
          - labels: '{alertname="BotCollectorUnavailable"}'
            value: 1
          - labels: '{alertname="BotWorkStuck"}'
            value: 1
          - labels: '{alertname="BotSpendingStale"}'
            value: 1
