rule_files:
  - ../logging/prometheus/bot-alerts.yml
  - ../logging/prometheus/host-health-alerts.yml
evaluation_interval: 1m
tests:
  - name: old textfile health must not be treated as live
    interval: 1m
    input_series:
      - series: up{job="node",instance="host"}
        values: '1+0x30'
      - series: prodenv_health_last_run_timestamp_seconds{job="node",instance="host"}
        values: '1+0x30'
      - series: prodenv_health_probe_last_success_timestamp_seconds{job="node",instance="host",probe="cpu",profile="test"}
        values: '1+0x30'
      - series: prodenv_health_probe_period_seconds{job="node",instance="host",probe="cpu",profile="test"}
        values: '3600+0x30'
    promql_expr_test:
      - expr: prodenv:health_fresh
        eval_time: 25m
        exp_samples: []
      - expr: prodenv:probe_fresh
        eval_time: 25m
        exp_samples: []
      - expr: count(ALERTS{alertname="HostHealthCollectorStale",alertstate="firing"})
        eval_time: 25m
        exp_samples:
          - labels: '{}'
            value: 1
  - name: degraded alert requires repeated fresh successful probes
    interval: 1m
    input_series:
      - series: up{job="node",instance="host"}
        values: '1+0x30'
      - series: prodenv_health_last_run_timestamp_seconds{job="node",instance="host"}
        values: '0+60x30'
      - series: prodenv_health_probe_last_success_timestamp_seconds{job="node",instance="host",probe="cpu",profile="test"}
        values: '1+0x30'
      - series: prodenv_health_probe_period_seconds{job="node",instance="host",probe="cpu",profile="test"}
        values: '3600+0x30'
      - series: prodenv_health_probe_status{job="node",instance="host",probe="cpu",profile="test"}
        values: '1+0x15 2+0x15'
      - series: prodenv_health_probe_degraded_runs{job="node",instance="host",probe="cpu",profile="test"}
        values: '3+0x30'
    promql_expr_test:
      - expr: count(ALERTS{alertname="HostBenchmarkDegraded",alertstate="firing"})
        eval_time: 10m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: ALERTS{alertname="HostBenchmarkDegraded",alertstate="firing"}
        eval_time: 25m
        exp_samples: []
  - name: quiet healthy bot does not alert
    interval: 1m
    input_series:
      - series: up{job="sinair-llm-bot-prod"}
        values: '1+0x30'
      - series: bot_metrics_snapshot_timestamp_seconds{job="sinair-llm-bot-prod"}
        values: '0+60x30'
      - series: bot_collector_heartbeat_timestamp_seconds{job="sinair-llm-bot-prod"}
        values: '0+60x30'
      - series: bot_llm_usage_timestamp_seconds{job="sinair-llm-bot-prod"}
        values: '0+60x30'
      - series: bot_state_enabled{job="sinair-llm-bot-prod"}
        values: '1+0x30'
      - series: bot_state_configured_rooms{job="sinair-llm-bot-prod"}
        values: '1+0x30'
      - series: bot_state_active_rooms{job="sinair-llm-bot-prod"}
        values: '1+0x30'
      - series: bot_collector_joined_rooms{job="sinair-llm-bot-prod"}
        values: '1+0x30'
      - series: bot_collector_sending_enabled{job="sinair-llm-bot-prod"}
        values: '1+0x30'
      - series: bot_queue_oldest_timestamp_seconds{job="sinair-llm-bot-prod",queue="inbox"}
        values: '0+0x30'
    promql_expr_test:
      - expr: ALERTS{alertstate="firing"}
        eval_time: 20m
        exp_samples: []
  - name: stale data and stuck work are actionable
    interval: 1m
    input_series:
      - series: up{job="sinair-llm-bot-prod"}
        values: '1+0x30'
      - series: bot_metrics_snapshot_timestamp_seconds{job="sinair-llm-bot-prod"}
        values: '0+60x30'
      - series: bot_state_enabled{job="sinair-llm-bot-prod"}
        values: '1+0x30'
      - series: bot_collector_heartbeat_timestamp_seconds{job="sinair-llm-bot-prod"}
        values: '1+0x30'
      - series: bot_llm_usage_timestamp_seconds{job="sinair-llm-bot-prod"}
        values: '1+0x30'
      - series: bot_queue_oldest_timestamp_seconds{job="sinair-llm-bot-prod",queue="outbound"}
        values: '1+0x30'
    promql_expr_test:
      - expr: count by (alertname) (ALERTS{alertstate="firing"})
        eval_time: 25m
        exp_samples:
          - labels: '{alertname="BotCollectorUnavailable"}'
            value: 1
          - labels: '{alertname="BotWorkStuck"}'
            value: 1
          - labels: '{alertname="BotSpendingStale"}'
            value: 1