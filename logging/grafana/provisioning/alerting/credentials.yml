apiVersion: 1
contactPoints:
  - orgId: 1
    name: credential-health-ntfy
    receivers:
      - uid: credential-health-ntfy
        type: webhook
        disableResolveMessage: false
        settings:
          url: http://ntfy/security?template=grafana
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: $WEB_SECURITY_NTFY_TOKEN
          maxAlerts: '20'
          title: 'Credentials: {{ .Status }}'
          message: |-
            {{ range .Alerts }}{{ .Annotations.summary }}
            {{ .Annotations.description }}
            {{ end }}
            https://grafana.taonity.org/d/mobile-server
groups:
  - orgId: 1
    name: credential-health
    folder: Security
    interval: 1m
    rules:
      - uid: credential-health-notifications
        title: Credential health
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: '{{ $labels.finding }} {{ $labels.project }} {{ $labels.credential }}'
          description: 'Severity: {{ $labels.severity }}. Check the recorded expiry policy or the Doppler host service; never paste credential values into alerts or agent conversations.'
          __dashboardUid__: mobile-server
        labels:
          security: credentials
        notification_settings:
          receiver: credential-health-ntfy
          group_by: [grafana_folder, alertname]
          group_wait: 1m
          group_interval: 10m
          repeat_interval: 24h
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: A
              expr: max by (finding, project, credential, severity) (label_replace(ALERTS{security="credentials",alertstate="firing"}, "finding", "$1", "alertname", "(.*)")) or vector(0)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  reducer:
                    type: last
                  type: query