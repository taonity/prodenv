apiVersion: 1
contactPoints:
  - orgId: 1
    name: web-security-ntfy
    receivers:
      - uid: web-security-ntfy
        type: webhook
        disableResolveMessage: false
        settings:
          url: http://ntfy/security?template=grafana
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: $WEB_SECURITY_NTFY_TOKEN
          maxAlerts: '10'
          title: 'Web security: {{ .Status }}'
          message: |-
            {{ range .Alerts }}{{ .Annotations.summary }}
            {{ .Annotations.description }}
            {{ end }}
            https://grafana.taonity.org/d/web-security
groups:
  - orgId: 1
    name: web-security
    folder: Security
    interval: 1m
    rules:
      - uid: web-security-notifications
        title: Web security
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: '{{ $labels.finding }} {{ $labels.site }} {{ $labels.name }}'
          description: 'Severity: {{ $labels.severity }}. Inspect Web Security and application logs. Detections do not imply compromise or automatic blocking.'
          __dashboardUid__: web-security
          __panelId__: '1'
        labels:
          security: web
        notification_settings:
          receiver: web-security-ntfy
          group_by: [grafana_folder, alertname]
          group_wait: 1m
          group_interval: 10m
          repeat_interval: 4h
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              expr: max by (finding, site, name, severity) (label_replace(ALERTS{security="web",alertstate="firing"}, "finding", "$1", "alertname", "(.*)")) or vector(0)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  reducer:
                    type: last
                  type: query