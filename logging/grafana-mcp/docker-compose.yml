services:
  grafana-mcp-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile.bootstrap
    env_file:
      - ../.env
    environment:
      GRAFANA_URL: http://grafana:3000
    volumes:
      - ./secrets:/output
    restart: "no"

  grafana-mcp:
    image: grafana/mcp-grafana:1.4.1
    restart: unless-stopped
    command:
      - --transport
      - streamable-http
      - --address
      - 0.0.0.0:8000
      - --allowed-hosts
      - grafana-mcp:8000,127.0.0.1:18000
      - --disable-write
      - --enabled-tools
      - loki
      - --max-loki-log-limit
      - "50"
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE: /run/secrets/grafana-token
    volumes:
      - ./secrets/grafana-token:/run/secrets/grafana-token:ro
    expose:
      - "8000"