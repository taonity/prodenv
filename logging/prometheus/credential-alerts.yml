groups:
  - name: credentials
    rules:
      - alert: CredentialExpiresWithin30Days
        expr: (prodenv_credential_expiry_timestamp_seconds - time() <= 30 * 86400) and (prodenv_credential_expiry_timestamp_seconds - time() > 7 * 86400)
        for: 5m
        labels:
          severity: warning
          security: credentials
        annotations:
          summary: '{{ $labels.project }} / {{ $labels.credential }} expires within 30 days'
          description: 'Arrange replacement at the provider, update Doppler, deploy and verify consumers before revoking the previous credential.'
      - alert: CredentialExpiresWithin7Days
        expr: (prodenv_credential_expiry_timestamp_seconds - time() <= 7 * 86400) and (prodenv_credential_expiry_timestamp_seconds - time() > 86400)
        for: 5m
        labels:
          severity: warning
          security: credentials
        annotations:
          summary: '{{ $labels.project }} / {{ $labels.credential }} expires within 7 days'
          description: 'Complete and verify credential replacement this week. Vault updates alone do not rotate provider credentials.'
      - alert: CredentialExpiresWithin1Day
        expr: (prodenv_credential_expiry_timestamp_seconds - time() <= 86400) and (prodenv_credential_expiry_timestamp_seconds - time() > 0)
        for: 5m
        labels:
          severity: critical
          security: credentials
        annotations:
          summary: '{{ $labels.project }} / {{ $labels.credential }} expires within 24 hours'
          description: 'Replace and verify this credential before it stops working.'
      - alert: CredentialExpired
        expr: prodenv_credential_expiry_timestamp_seconds <= time()
        for: 5m
        labels:
          severity: critical
          security: credentials
        annotations:
          summary: '{{ $labels.project }} / {{ $labels.credential }} has expired'
          description: 'The recorded provider or machine-token expiry has passed. Restore access and update its metadata.'
      - alert: CredentialExpiryUnknown
        expr: prodenv_credential_expiry_known == 0
        for: 15m
        labels:
          severity: warning
          security: credentials
        annotations:
          summary: '{{ $labels.project }} / {{ $labels.credential }} has no recorded expiry policy'
          description: 'Record the actual expiry timestamp or explicitly mark a non-expiring credential as never and set a review date.'
      - alert: CredentialReviewOverdue
        expr: prodenv_credential_review_timestamp_seconds < time()
        for: 15m
        labels:
          severity: warning
          security: credentials
        annotations:
          summary: '{{ $labels.project }} / {{ $labels.credential }} is due for review'
          description: 'Review provider scope, ownership and rotation needs, then update the review date.'
      - alert: CredentialDeliveryFailed
        expr: prodenv_secret_delivery_success == 0
        for: 5m
        labels:
          severity: critical
          security: credentials
        annotations:
          summary: '{{ $labels.project }} credential delivery failed'
          description: 'Check the Doppler host service, connectivity, credentials and container health. Do not print secret files or environment dumps.'
      - alert: CredentialInventoryStale
        expr: (time() - prodenv_secret_inventory_timestamp_seconds > 7200) or (prodenv_secret_delivery_expected unless on(project) prodenv_secret_inventory_timestamp_seconds)
        for: 15m
        labels:
          severity: warning
          security: credentials
        annotations:
          summary: '{{ $labels.project }} credential inventory is stale or missing'
          description: 'The metadata-only Doppler metrics timer has stopped reporting; expiry notifications may be incomplete.'
      - alert: CredentialRecoveryExportFailed
        expr: prodenv_secret_export_success == 0
        for: 5m
        labels:
          severity: critical
          security: credentials
        annotations:
          summary: '{{ $labels.project }} encrypted credential export failed'
          description: 'Check the Doppler retrieval and age recovery recipient. Do not proceed without an independently decryptable backup.'
      - alert: CredentialRecoveryExportStale
        expr: (time() - prodenv_secret_export_timestamp_seconds > 3600) or (prodenv_secret_delivery_expected unless on(project) prodenv_secret_export_timestamp_seconds)
        for: 10m
        labels:
          severity: warning
          security: credentials
        annotations:
          summary: '{{ $labels.project }} encrypted credential export is stale or missing'
          description: 'The five-minute polling/export job is not producing recent recovery snapshots.'
      - alert: CredentialRecoveryOffsiteStale
        expr: (prodenv_secret_export_timestamp_seconds > 0) unless on() (time() - prodenv_backup_last_success_timestamp_seconds{operation="secret-recovery"} < 3600)
        for: 15m
        labels:
          severity: critical
          security: credentials
        annotations:
          summary: '{{ $labels.project }} credential recovery lacks a recent offsite snapshot'
          description: 'Local encryption is not an offsite backup. Check the Backrest secret-recovery plan and keep repository access and age private keys outside this host.'