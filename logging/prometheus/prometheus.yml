global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/resource-alerts.yml
  - /etc/prometheus/bot-alerts.yml

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    scrape_interval: 30s
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: "artist-insight-service-prod"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["artist-insight-service-prod-app:8080"]

  - job_name: "sinair-llm-bot-prod"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["sinair-llm-bot-prod-backend:8080"]
        labels:
          service: sinair-llm-bot
          environment: prod