# HTTP: ACME challenge + redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name webhook.taonity.org;

    include conf.d/include/letsencrypt-acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: reverse proxy to docker-webhook.
# Long timeouts + disabled buffering — webhook handlers may stream build logs.
server {
    server_name webhook.taonity.org;

    include conf.d/include/tls.conf;
    include conf.d/include/security-headers.conf;
    include conf.d/include/block-exploits.conf;

    location / {
        include conf.d/include/proxy.conf;

        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        send_timeout          600s;
        proxy_buffering       off;

        proxy_pass http://docker-webhook:9000;
    }
}
