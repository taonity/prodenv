# "You are not configured" page, which is the default if another default doesn't exist
server {
	listen 80 default_server;
	listen [::]:80 default_server;

	set $forward_scheme "http";
	set $server "127.0.0.1";
	set $port "80";

	server_name localhost-nginx-proxy-manager;
	# include conf.d/include/assets.conf;
	include conf.d/include/block-exploits.conf;
	include conf.d/include/letsencrypt-acme-challenge.conf;

	location / {
		index index.html;
		root /var/www/html;
	}
}

# First 443 Host, which is the default if another default doesn't exist
server {
	listen 443 ssl default_server;
	listen [::]:443 ssl default_server;

	set $forward_scheme "https";
	set $server "127.0.0.1";
	set $port "443";

	server_name _;
	error_log /dev/null crit;
	include conf.d/include/ssl-ciphers.conf;
	ssl_certificate /etc/letsencrypt/live/taonity.org/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/taonity.org/privkey.pem;

	return 444;
}