# Catch-all HTTP: serve ACME challenges, drop everything else.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include conf.d/include/letsencrypt-acme-challenge.conf;

    location / {
        return 444;
    }
}

# Catch-all HTTPS: silently close connections for unknown hostnames.
# Uses the wildcard cert because TLS must terminate before we know SNI.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/taonity.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taonity.org/privkey.pem;

    access_log off;
    error_log  /dev/null crit;

    return 444;
}