server {
    server_name artist-insight-api.taonity.org;

    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # Let's Encrypt SSL
    include conf.d/include/letsencrypt-acme-challenge.conf;
    include conf.d/include/ssl-ciphers.conf;
    ssl_certificate /etc/letsencrypt/live/taonity.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taonity.org/privkey.pem;

    # Block Exploits
    include conf.d/include/block-exploits.conf;
    # Force SSL
    include conf.d/include/force-ssl.conf;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;

    location / {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_http_version 1.1;
        
        # proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header X-Forwarded-Proto https;

        # Allow cookies to pass
        # proxy_cookie_path / "/; Secure; SameSite=None";
        # proxy_cookie_domain .taonity.org;

        # Proxy!
        include conf.d/include/proxy.conf;
        proxy_pass       http://artist-insight-service-prod-app:8080;
    }
}
