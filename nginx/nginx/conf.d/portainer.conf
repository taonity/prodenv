# HTTP: ACME challenge + redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name portainer.taonity.org;

    include conf.d/include/letsencrypt-acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: reverse proxy to Portainer (WebSockets for live console / logs)
server {
    server_name portainer.taonity.org;

    include conf.d/include/tls.conf;
    include conf.d/include/security-headers.conf;
    include conf.d/include/block-exploits.conf;

    location / {
        include conf.d/include/proxy.conf;
        proxy_pass http://portainer:9000;
    }
}
