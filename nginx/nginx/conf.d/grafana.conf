# HTTP: ACME challenge + redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name grafana.taonity.org;

    include conf.d/include/letsencrypt-acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: reverse proxy to Grafana (WebSockets supported via $connection_upgrade map)
server {
    server_name grafana.taonity.org;

    include conf.d/include/tls.conf;
    include conf.d/include/security-headers.conf;
    include conf.d/include/block-exploits.conf;

    # Cache static assets; proxy_cache zone is defined in nginx.conf
    include conf.d/include/assets.conf;

    location / {
        include conf.d/include/proxy.conf;
        proxy_pass http://grafana:3000;
    }
}
