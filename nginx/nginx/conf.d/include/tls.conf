# Shared TLS server configuration.
# Include inside a `server { ... }` block that handles HTTPS (port 443).
# Cert is a wildcard for *.taonity.org issued by Let's Encrypt.

listen 443 ssl;
listen [::]:443 ssl;
http2 on;

ssl_certificate     /etc/letsencrypt/live/taonity.org/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/taonity.org/privkey.pem;
ssl_trusted_certificate /etc/letsencrypt/live/taonity.org/chain.pem;
