user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---------------------------------------------------------------------
    # Basic hardening / hygiene
    # ---------------------------------------------------------------------
    server_tokens                  off;
    server_names_hash_bucket_size  128;
    types_hash_max_size            2048;
    client_max_body_size           50m;
    client_body_buffer_size        128k;
    client_header_buffer_size      4k;
    large_client_header_buffers    4 16k;

    # ---------------------------------------------------------------------
    # Performance
    # ---------------------------------------------------------------------
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    reset_timedout_connection on;

    # ---------------------------------------------------------------------
    # Logging
    # ---------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main buffer=32k flush=5s;

    # ---------------------------------------------------------------------
    # Gzip
    # ---------------------------------------------------------------------
    gzip                on;
    gzip_vary           on;
    gzip_proxied        any;
    gzip_comp_level     6;
    gzip_min_length     1024;
    gzip_types          text/plain text/css text/xml application/json
                        application/javascript application/xml+rss
                        application/atom+xml image/svg+xml font/ttf font/otf;

    # ---------------------------------------------------------------------
    # TLS defaults (cert / key still set per-server)
    # ---------------------------------------------------------------------
    ssl_protocols              TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers  off;
    ssl_ciphers                'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache          shared:SSL:50m;
    ssl_session_timeout        1d;
    ssl_session_tickets        off;
    # OCSP stapling (requires resolver below + full chain in fullchain.pem)
    ssl_stapling               on;
    ssl_stapling_verify        on;
    resolver                   127.0.0.11 valid=30s ipv6=off;
    resolver_timeout           5s;

    # ---------------------------------------------------------------------
    # WebSocket upgrade map (single source of truth)
    # ---------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---------------------------------------------------------------------
    # Shared proxy cache zone (used by include/assets.conf)
    # ---------------------------------------------------------------------
    proxy_cache_path /var/cache/nginx/public
                     levels=1:2
                     keys_zone=public-cache:50m
                     max_size=1g
                     inactive=60m
                     use_temp_path=off;

    # ---------------------------------------------------------------------
    # Proxy defaults
    # ---------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_buffering    on;
    proxy_buffer_size  8k;
    proxy_buffers      16 8k;
    proxy_connect_timeout 30s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    include /etc/nginx/conf.d/*.conf;
}
