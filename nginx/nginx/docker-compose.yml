services:
  nginx:
    image: nginx:1.29.0
    container_name: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./../data/certbot/letsencrypt:/etc/letsencrypt
      - ./../data/certbot/www:/var/www/certbot
    tmpfs:
      # Backs proxy_cache_path zone "public-cache" (declared in nginx.conf)
      - /var/cache/nginx:uid=101,gid=101,mode=0750,size=512m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8089/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - certbot
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"